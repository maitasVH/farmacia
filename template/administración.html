<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/styles2.css">
    <title>medicamentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <img class="cruzVerde" src="/static/img/cruz_verde_stk.png">
    <h1>Administración de Medicamentos</h1>
    
<!--tabla de administración-->
<table border = "1">
    <thead>
        <tr>
            
            <th>nombre</th>
            <th>categoria</th>
            <th>cantidad</th>
            <th>dosis</th>
            <th>precio</th>
        </tr>
    </thead>
    <tbody>
        {% for medicamento in medicamentos %}
        <tr>
            
            <td>{{ medicamento.nombre }}</td>
            <td>{{ medicamento.categoria }}</td>
            <td>{{ medicamento.cantidad }}</td>
            <td>{{ medicamento.dosis }}</td>
            <td>{{ medicamento.precio }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="6">No hay medicamentos registrados.</td>
        </tr>
        {% endfor %}
    </tbody>
    
</table>

<a href="/">
    <button class="btn-regreso1">volver</button>
</a>

<a href="/registro-medicamento">
    <button class="btn-1">registrar medicamentos</button>
</a>    


</body>
</html>
